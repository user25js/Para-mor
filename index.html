<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💌 Para Yemima - Carta de Amor</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet">

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Dancing Script', cursive;
  background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 50%, #4c0519 100%);
  min-height: 100vh;
  overflow-x: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  position: relative;
}

/* FONDO DE ROSAS */
.rose-background {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><defs><pattern id="roses" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse"><text x="50" y="100" font-size="80" opacity="0.15">🌹</text></pattern></defs><rect width="1200" height="800" fill="none"/><rect width="1200" height="800" fill="url(%23roses)"/></svg>');
  background-size: 200px 200px;
  opacity: 0.6;
}

/* FLORES FLOTANTES */
.flower-bg {
  position: fixed;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  pointer-events: none;
  z-index: 1;
}

.flower {
  position: absolute;
  font-size: 40px;
  animation: float 8s infinite ease-in-out;
  filter: drop-shadow(0 0 10px rgba(220, 38, 38, 0.5));
}

.flower.rose {
  animation: float-rose 10s infinite ease-in-out;
}

@keyframes float {
  0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
  50% { transform: translateY(-30px) rotate(10deg); opacity: 1; }
}

@keyframes float-rose {
  0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
  25% { transform: translateY(-40px) rotate(5deg); }
  75% { transform: translateY(-20px) rotate(-5deg); }
}

/* SOBRE PRINCIPAL */
.envelope-container {
  position: relative;
  z-index: 10;
  animation: envelope-appear 0.8s ease-out;
}

@keyframes envelope-appear {
  from {
    opacity: 0;
    transform: scale(0.8) rotateY(90deg);
  }
  to {
    opacity: 1;
    transform: scale(1) rotateY(0deg);
  }
}

.envelope {
  width: 380px;
  height: 260px;
  background: linear-gradient(135deg, #dc2626 0%, #7f1d1d 100%);
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(220, 38, 38, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  cursor: pointer;
  transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  border: 3px solid #991b1b;
  position: relative;
  overflow: hidden;
}

.envelope::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.1) 50%, transparent 70%);
  animation: shine 3s infinite;
}

.envelope::after {
  content: '🌹 🌹 🌹';
  position: absolute;
  top: 10px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 20px;
  z-index: 1;
  opacity: 0.6;
}

@keyframes shine {
  0%, 100% { transform: translateX(-100%); }
  50% { transform: translateX(100%); }
}

.envelope:hover {
  transform: scale(1.1) translateY(-10px);
  box-shadow: 0 30px 80px rgba(220, 38, 38, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.2);
}

.envelope-icon {
  font-size: 100px;
  margin-bottom: 15px;
  animation: pulse 2s ease-in-out infinite;
  z-index: 2;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

.envelope-text {
  font-size: 28px;
  font-weight: bold;
  color: white;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
  z-index: 2;
  letter-spacing: 2px;
}

/* TARJETA PRINCIPAL */
.card {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  max-width: 1000px;
  width: 95%;
  max-height: 90vh;
  background: linear-gradient(135deg, #fff8f3 0%, #fff0e6 100%);
  border-radius: 30px;
  box-shadow: 0 30px 100px rgba(0, 0, 0, 0.5);
  z-index: 100;
  overflow-y: auto;
  animation: card-open 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  border: 5px solid #dc2626;
  position: relative;
}

.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 30px;
  background: linear-gradient(90deg, transparent, #dc2626, transparent);
  border-radius: 30px 30px 0 0;
  z-index: 102;
}

.card::after {
  content: '🌹';
  position: absolute;
  top: -15px;
  right: 30px;
  font-size: 40px;
  z-index: 103;
  animation: rotate-rose 3s linear infinite;
}

@keyframes rotate-rose {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes card-open {
  to {
    transform: translate(-50%, -50%) scale(1);
  }
}

.card-content {
  padding: 50px 40px;
  color: #333;
}

.close-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  background: #dc2626;
  color: white;
  border: none;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  font-size: 28px;
  cursor: pointer;
  z-index: 101;
  transition: all 0.3s;
  box-shadow: 0 5px 15px rgba(220, 38, 38, 0.4);
}

.close-btn:hover {
  background: #991b1b;
  transform: scale(1.1) rotate(90deg);
}

/* TÍTULO Y DECORACIÓN */
.card h1 {
  color: #dc2626;
  font-size: 3.5rem;
  text-align: center;
  margin-bottom: 10px;
  font-family: 'Caveat', cursive;
  letter-spacing: 3px;
  text-shadow: 0 2px 10px rgba(220, 38, 38, 0.2);
}

.heart-decoration {
  text-align: center;
  font-size: 30px;
  margin-bottom: 30px;
  animation: heartbeat 1.5s ease-in-out infinite;
  letter-spacing: 10px;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  25% { transform: scale(1.2); }
  50% { transform: scale(1); }
}

/* LAYOUT CON FOTOS ESTRATÉGICAS */
.poem-with-photos {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 30px;
  align-items: start;
  margin: 30px 0;
  background: linear-gradient(135deg, rgba(220, 38, 38, 0.05) 0%, rgba(220, 38, 38, 0.02) 100%);
  padding: 25px;
  border-radius: 20px;
  border: 2px solid #fecaca;
}

.poem-container {
  grid-column: 1;
}

.message {
  font-family: 'Caveat', cursive;
  font-size: 1.8rem;
  line-height: 2.2;
  color: #6b4423;
  background: rgba(255, 255, 255, 0.7);
  padding: 25px;
  border-radius: 15px;
  border-left: 5px solid #dc2626;
  white-space: pre-wrap;
  word-wrap: break-word;
  text-align: justify;
  font-weight: 500;
  min-height: 300px;
  box-shadow: 0 5px 20px rgba(220, 38, 38, 0.1);
}

.message-char {
  animation: appear 0.1s ease-out;
  display: inline;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* PREGUNTA FINAL - SOLO EN MENSAJE PRINCIPAL */
.final-question {
  font-family: 'Caveat', cursive;
  font-size: 2rem;
  color: #dc2626;
  text-align: center;
  margin-top: 40px;
  padding: 30px 20px;
  background: linear-gradient(135deg, rgba(220, 38, 38, 0.15) 0%, rgba(245, 158, 11, 0.15) 100%);
  border-radius: 15px;
  border: 3px solid #dc2626;
  animation: question-pulse 2s ease-in-out infinite;
  font-weight: bold;
  letter-spacing: 1px;
  display: none;
  min-height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
}

@keyframes question-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}

.question-mark {
  display: inline-block;
  animation: bounce-question 1.5s ease-in-out infinite;
  margin-left: 10px;
  font-size: 2.5rem;
}

@keyframes bounce-question {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

/* FOTOS ESTRATÉGICAS */
.side-photos {
  grid-column: 2;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.side-photo {
  width: 100%;
  height: 200px;
  border-radius: 15px;
  object-fit: cover;
  border: 4px solid #dc2626;
  box-shadow: 0 10px 30px rgba(220, 38, 38, 0.3);
  transition: all 0.3s;
  animation: photo-appear 0.6s ease-out;
  position: relative;
}

.side-photo:hover {
  transform: scale(1.05) rotate(2deg);
  box-shadow: 0 15px 40px rgba(220, 38, 38, 0.4);
  filter: drop-shadow(0 0 15px rgba(220, 38, 38, 0.5));
}

@keyframes photo-appear {
  from {
    opacity: 0;
    transform: translateX(50px) rotate(-10deg);
  }
  to {
    opacity: 1;
    transform: translateX(0) rotate(0deg);
  }
}

.side-photo:nth-child(1) { animation-delay: 1s; }
.side-photo:nth-child(2) { animation-delay: 1.5s; }

.side-photo::before {
  content: '🌹';
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 25px;
  background: rgba(255, 255, 255, 0.9);
  padding: 5px 10px;
  border-radius: 50%;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
}

/* SECCIÓN DE GALERÍA PRINCIPAL */
.gallery-section {
  margin: 40px 0;
  clear: both;
}

.gallery-title {
  color: #dc2626;
  font-size: 2rem;
  margin-bottom: 20px;
  text-align: center;
  font-family: 'Caveat', cursive;
  letter-spacing: 2px;
}

.gallery-container {
  position: relative;
  width: 100%;
  max-width: 700px;
  margin: 0 auto;
  background: white;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 15px 50px rgba(220, 38, 38, 0.3);
  border: 5px solid #dc2626;
}

.gallery-header {
  display: flex;
  justify-content: center;
  gap: 5px;
  padding: 10px;
  background: linear-gradient(90deg, #dc2626, #991b1b);
}

.gallery-rose {
  font-size: 20px;
  animation: sway 2s ease-in-out infinite;
}

.gallery-rose:nth-child(2) { animation-delay: 0.2s; }
.gallery-rose:nth-child(3) { animation-delay: 0.4s; }

@keyframes sway {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(10deg); }
}

.gallery-img {
  width: 100%;
  height: 450px;
  object-fit: cover;
  animation: fade-in 0.8s ease-out;
  display: block;
}

@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

.gallery-controls {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 20px;
  align-items: center;
}

.gallery-btn {
  background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
  color: white;
  border: none;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 5px 15px rgba(220, 38, 38, 0.4);
  font-weight: bold;
}

.gallery-btn:hover {
  background: linear-gradient(135deg, #991b1b 0%, #7f1d1d 100%);
  transform: scale(1.15);
  box-shadow: 0 8px 20px rgba(220, 38, 38, 0.6);
}

.gallery-dots {
  display: flex;
  gap: 8px;
}

.dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #fecaca;
  cursor: pointer;
  transition: all 0.3s;
  border: 2px solid #dc2626;
}

.dot.active {
  background: #dc2626;
  transform: scale(1.3);
  box-shadow: 0 0 10px rgba(220, 38, 38, 0.6);
}

/* BOTONES */
.button-group {
  display: flex;
  gap: 15px;
  margin-top: 40px;
  flex-wrap: wrap;
  justify-content: center;
}

.btn {
  padding: 15px 30px;
  border: none;
  border-radius: 50px;
  font-size: 1rem;
  font-family: 'Dancing Script', cursive;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
  font-weight: bold;
  letter-spacing: 1px;
  border: 2px solid transparent;
}

.btn-music {
  background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
  color: white;
}

.btn-music:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 30px rgba(220, 38, 38, 0.5);
  border-color: #fff;
}

.btn-surprise {
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: white;
}

.btn-surprise:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 30px rgba(245, 158, 11, 0.5);
  border-color: #fff;
}

/* REPRODUCTOR DE MÚSICA */
.player-container {
  background: linear-gradient(135deg, rgba(220, 38, 38, 0.15) 0%, rgba(220, 38, 38, 0.05) 100%);
  border-radius: 20px;
  padding: 25px;
  margin-top: 20px;
  border: 3px solid #dc2626;
  animation: slideDown 0.5s ease-out;
  display: none;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-20px);
    max-height: 0;
  }
  to {
    opacity: 1;
    transform: translateY(0);
    max-height: 400px;
  }
}

.player-container.active {
  display: block;
}

.player-container iframe {
  border-radius: 15px;
  border: 2px solid #dc2626;
}

.player-status {
  text-align: center;
  color: #dc2626;
  font-family: 'Dancing Script', cursive;
  font-size: 1.2rem;
  margin-bottom: 15px;
  font-weight: bold;
}

.music-icon {
  animation: music-pulse 1s ease-in-out infinite;
  display: inline-block;
  margin-right: 10px;
}

@keyframes music-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

/* EFECTOS DE SORPRESA */
.surprise-box {
  background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
  border-radius: 20px;
  padding: 30px;
  margin-top: 30px;
  text-align: center;
  border: 4px solid #fcd34d;
  animation: bounce 0.6s ease-out;
  display: none;
  box-shadow: 0 10px 40px rgba(220, 38, 38, 0.2);
}

.surprise-box.active {
  display: block;
}

@keyframes bounce {
  0% { transform: scale(0) rotate(-180deg); opacity: 0; }
  50% { transform: scale(1.1); }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

.surprise-text {
  font-size: 1.5rem;
  color: #92400e;
  font-family: 'Caveat', cursive;
  margin: 15px 0;
}

.surprise-emoji {
  font-size: 50px;
  animation: dance 1s ease-in-out infinite;
}

@keyframes dance {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-15px) rotate(-5deg); }
  75% { transform: translateY(-15px) rotate(5deg); }
}

/* RESPONSIVE */
@media (max-width: 1024px) {
  .poem-with-photos {
    grid-template-columns: 1fr;
  }
  
  .side-photos {
    grid-column: 1;
    flex-direction: row;
  }
  
  .side-photo {
    flex: 1;
    height: 150px;
  }
}

@media (max-width: 768px) {
  .envelope {
    width: 280px;
    height: 200px;
  }
  
  .card {
    max-width: 95%;
  }
  
  .card-content {
    padding: 30px 20px;
  }
  
  .card h1 {
    font-size: 2.5rem;
  }
  
  .message {
    font-size: 1.4rem;
  }
  
  .gallery-img {
    height: 300px;
  }
  
  .poem-with-photos {
    grid-template-columns: 1fr;
  }
  
  .side-photos {
    grid-column: 1;
    flex-direction: row;
  }
  
  .side-photo {
    flex: 1;
  }

  .final-question {
    font-size: 1.5rem;
  }
}

/* CONFETI */
.confetti {
  position: fixed;
  pointer-events: none;
  z-index: 99;
}

</style>
</head>

<body>

<div class="rose-background"></div>
<div class="flower-bg" id="flowerBg"></div>

<div class="envelope-container">
  <div class="envelope" onclick="openLetter()">
    <div class="envelope-icon">💌</div>
    <div class="envelope-text">Ábreme</div>
  </div>
</div>

<div class="card" id="card">
  <button class="close-btn" onclick="closeLetter()">✕</button>
  
  <div class="card-content">
    
    <h1>Para Ti, Yemima ❤️</h1>
    <div class="heart-decoration">❤️ 🌹 ❤️</div>
    
    <!-- POEMA CON FOTOS LATERALES -->
    <div class="poem-with-photos">
      <div class="poem-container">
        <div id="message" class="message"></div>
        <div id="finalQuestion" class="final-question"></div>
      </div>
      <div class="side-photos">
        <img class="side-photo" src="https://raw.githubusercontent.com/user25js/Para-mor/main/WhatsApp%20Image%202026-06-06%20at%203.31.55%20PM.jpeg" alt="Foto 1">
        <img class="side-photo" src="https://raw.githubusercontent.com/user25js/Para-mor/main/WhatsApp%20Image%202026-06-06%20at%203.32.27%20PM.jpeg" alt="Foto 2">
      </div>
    </div>
    
    <!-- GALERÍA PRINCIPAL -->
    <div class="gallery-section">
      <div class="gallery-title">💝 Nuestros Momentos Especiales 💝</div>
      <div class="gallery-container">
        <div class="gallery-header">
          <span class="gallery-rose">🌹</span>
          <span class="gallery-rose">🌹</span>
          <span class="gallery-rose">🌹</span>
        </div>
        <img id="galleryImg" class="gallery-img" src="https://raw.githubusercontent.com/user25js/Para-mor/main/WhatsApp%20Image%202026-06-06%20at%203.31.55%20PM.jpeg" alt="Galería">
      </div>
      <div class="gallery-controls">
        <button class="gallery-btn" onclick="prevPhoto()">❮</button>
        <div class="gallery-dots" id="dots"></div>
        <button class="gallery-btn" onclick="nextPhoto()">❯</button>
      </div>
    </div>
    
    <!-- BOTONES -->
    <div class="button-group">
      <button class="btn btn-music" onclick="toggleMusic()">🎵 Nuestra Canción</button>
      <button class="btn btn-surprise" onclick="showSurprise()">✨ Sorpresa Especial</button>
    </div>
    
    <!-- REPRODUCTOR -->
    <div id="playerContainer" class="player-container">
      <div class="player-status">
        <span class="music-icon">🎵</span>Nuestra Canción Está Sonando
      </div>
      <iframe width="100%" height="315" 
        src="https://www.youtube.com/embed/HJqlA_HTEU8?autoplay=1" 
        frameborder="0" allow="autoplay; encrypted-media" allowfullscreen>
      </iframe>
    </div>
    
    <!-- SORPRESA -->
    <div id="surpriseBox" class="surprise-box">
      <div class="surprise-emoji">🎁</div>
      <div class="surprise-text">Te amo más cada día</div>
      <div class="surprise-emoji">💕</div>
      <p style="color: #92400e; font-family: 'Dancing Script', cursive; font-size: 1.2rem; margin-top: 15px;">
        Gracias por ser mi razón para sonreír cada mañana, mi inspiración, mi todo.
      </p>
      <div class="surprise-emoji" style="margin-top: 15px;">🌹✨💕</div>
    </div>
    
  </div>
</div>

<script>

// CREAR FLORES FLOTANTES
function createFlowers() {
  const bg = document.getElementById('flowerBg');
  const flowers = ['🌹', '🌹', '🌹', '🌹', '🌹', '🌹', '🌻', '🌻'];
  
  for (let i = 0; i < 20; i++) {
    let flower = document.createElement('div');
    flower.className = 'flower ' + (Math.random() > 0.3 ? 'rose' : '');
    flower.innerHTML = flowers[Math.floor(Math.random() * flowers.length)];
    flower.style.left = Math.random() * 100 + '%';
    flower.style.top = Math.random() * 100 + '%';
    flower.style.animationDelay = Math.random() * 3 + 's';
    flower.style.animationDuration = (8 + Math.random() * 6) + 's';
    bg.appendChild(flower);
  }
}

// ABRIR CARTA
function openLetter() {
  document.querySelector('.envelope-container').style.display = 'none';
  document.getElementById('card').style.display = 'block';
  typeMessage();
  createDots();
  createConfetti();
  
  // Iniciar música automáticamente después de 2 segundos
  setTimeout(() => {
    startMusic();
  }, 2000);
}

// CERRAR CARTA
function closeLetter() {
  document.getElementById('card').style.display = 'none';
  document.querySelector('.envelope-container').style.display = 'flex';
  document.getElementById('playerContainer').classList.remove('active');
  document.getElementById('surpriseBox').classList.remove('active');
  stopMusic();
}

// MENSAJE CON EFECTO ESCRITURA
const poemText = `Yemima, mi amor,

Cada mañana despiertas en mis pensamientos,
cada noche cierro los ojos y veo tu sonrisa.
En tus ojos café habita un universo entero,

const photos = [
  "https://raw.githubusercontent.com/user25js/Para-mor/main/WhatsApp%20Image%202026-06-06%20at%203.31.55%20PM.jpeg",
  "https://raw.githubusercontent.com/user25js/Para-mor/main/WhatsApp%20Image%202026-06-06%20at%203.32.27%20PM.jpeg",

];

let currentPhoto = 0;

function createDots() {
  const dotsContainer = document.getElementById('dots');
  dotsContainer.innerHTML = '';
  photos.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.onclick = () => goToPhoto(i);
    dotsContainer.appendChild(dot);
  });
}

function nextPhoto() {
  currentPhoto = (currentPhoto + 1) % photos.length;
  updatePhoto();
}

function prevPhoto() {
  currentPhoto = (currentPhoto - 1 + photos.length) % photos.length;
  updatePhoto();
}

function goToPhoto(index) {
  currentPhoto = index;
  updatePhoto();
}

function updatePhoto() {
  document.getElementById('galleryImg').src = photos[currentPhoto];
  updateDots();
}

function updateDots() {
  document.querySelectorAll('.dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === currentPhoto);
  });
}

// MÚSICA - Reproducir automáticamente
function startMusic() {
  const player = document.getElementById('playerContainer');
  player.classList.add('active');
}

// MÚSICA - Toggle manual
function toggleMusic() {
  const player = document.getElementById('playerContainer');
  player.classList.toggle('active');
}

// Detener música
function stopMusic() {
  const iframe = document.querySelector('#playerContainer iframe');
  if (iframe) {
    iframe.src = iframe.src.replace('autoplay=1', 'autoplay=0');
  }
}

// SORPRESA
function showSurprise() {
  const surprise = document.getElementById('surpriseBox');
  surprise.classList.toggle('active');
  if (surprise.classList.contains('active')) {
    createConfetti();
  }
}

// CONFETI
function createConfetti() {
  const colors = ['#dc2626', '#f59e0b', '#fecaca', '#fed7aa'];
  for (let i = 0; i < 40; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.innerHTML = Math.random() > 0.4 ? '🌹' : Math.random() > 0.5 ? '✨' : '💕';
    confetti.style.left = Math.random() * 100 + 'vw';
    confetti.style.top = '-10px';
    confetti.style.fontSize = (15 + Math.random() * 25) + 'px';
    confetti.style.animation = `fall ${2 + Math.random() * 3}s linear forwards`;
    document.body.appendChild(confetti);
    
    setTimeout(() => confetti.remove(), 5000);
  }
}
