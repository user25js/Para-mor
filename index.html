<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Yemima ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Dancing Script',cursive;
background:linear-gradient(135deg,#0f172a,#1e293b);
overflow-x:hidden;
text-align:center;
color:white;
}

.envelope{
width:320px;
height:220px;
background:#d62828;
margin:120px auto;
border-radius:20px;
display:flex;
justify-content:center;
align-items:center;
font-size:80px;
cursor:pointer;
box-shadow:0 0 40px rgba(0,0,0,.4);
transition:1s;
}

.envelope:hover{
transform:scale(1.1);
box-shadow:0 0 60px rgba(214,40,40,.6);
}

.card{
display:none;
max-width:900px;
margin:40px auto;
background:white;
color:#333;
padding:30px;
border-radius:20px;
box-shadow:0 0 40px rgba(0,0,0,.4);
}

h1{
color:#d62828;
font-size:4rem;
margin:0;
}

.message{
font-size:2rem;
line-height:1.8;
white-space:pre-line;
min-height:300px;
color:#333;
}

.gallery img{
width:100%;
max-height:500px;
object-fit:cover;
border-radius:15px;
margin:20px 0;
}

.music-btn{
padding:15px 25px;
background:#d62828;
border:none;
color:white;
border-radius:50px;
cursor:pointer;
font-size:18px;
margin-top:20px;
transition:0.3s;
}

.music-btn:hover{
background:#b01e1e;
transform:scale(1.05);
}

.flower{
position:fixed;
top:-50px;
font-size:30px;
animation:fall linear infinite;
pointer-events:none;
}

@keyframes fall{
to{
transform:translateY(120vh) rotate(360deg);
}
}

</style>
</head>

<body>

<div class="envelope" onclick="openLetter()">
💌
</div>

<div class="card" id="card">

<h1>Para Yemima ❤️</h1>

<div id="typed" class="message"></div>

<div class="gallery">
<img id="slider" src="https://raw.githubusercontent.com/user25js/Para-mor/main/WhatsApp%20Image%202026-06-06%20at%203.31.55%20PM.jpeg" alt="Galería">
</div>

<button class="music-btn" onclick="togglePlayer()">
🎵 Nuestra Canción
</button>

<div id="playerContainer" style="display:none;margin-top:20px;">
<iframe
width="100%"
height="315"
src="https://www.youtube.com/embed/HJqlA_HTEU8"
frameborder="0"
allow="autoplay; encrypted-media"
allowfullscreen>
</iframe>
</div>

</div>

<script>

/* Rosas y girasoles */

for(let i=0;i<80;i++){

let flower=document.createElement("div");

flower.className="flower";

flower.innerHTML=Math.random()>0.5 ? "🌹" : "🌻";

flower.style.left=Math.random()*100+"vw";

flower.style.animationDuration=
(8+Math.random()*8)+"s";

document.body.appendChild(flower);

}

/* Abrir carta */

function openLetter(){

document.querySelector(".envelope").style.display="none";

document.getElementById("card").style.display="block";

writeText();

}

/* Mensaje */

const poem=`Yemima ❤️

Todo el tiempo que pasamos,
todo el tiempo pensando en ti,
naufragando en tus ojos profundos,
en tus labios con sabor a abril.

Solo para derretirme una vez
mirando tus ojos café,
como quien contempla un universo
y olvida para siempre volver.

Porque habita una extraña magia
en la curva suave de tu mirar,
una forma silenciosa y dulce
de hacer al alma temblar.

Y yo, que creía conocer el tiempo,
descubrí que estaba equivocado;
porque una hora lejos de ti
se siente como un siglo callado.

Tus ojos guardan atardeceres,
tus manos, refugios de paz,
y tu nombre, cuando lo pronuncio,
suena como un verso inmortal.

Déjame quedarme en ese instante
donde tus pupilas rozan mi ser,
como una estrella que encuentra su cielo,
como la lluvia que vuelve a caer.

Y si algún día la noche pregunta
qué fue lo más bello que viví,
diré que existieron unos ojos café
y que tuve la suerte de perderme allí.

❤️`;

let index=0;

function writeText(){

let target=document.getElementById("typed");

let timer=setInterval(()=>{

target.innerHTML += poem.charAt(index);

index++;

if(index>=poem.length){

clearInterval(timer);

}

},35);

}

/* Galería */

const photos=[
"https://raw.githubusercontent.com/user25js/Para-mor/main/WhatsApp%20Image%202026-06-06%20at%203.31.55%20PM.jpeg",
"https://raw.githubusercontent.com/user25js/Para-mor/main/WhatsApp%20Image%202026-06-06%20at%203.32.27%20PM.jpeg",
"https://raw.githubusercontent.com/user25js/Para-mor/main/WhatsApp%20Image%202026-06-06%20at%203.33.01%20PM.jpeg",
"https://raw.githubusercontent.com/user25js/Para-mor/main/WhatsApp%20Image%202026-06-06%20at%203.33.28%20PM.jpeg"
];

let current=0;

setInterval(()=>{

let slider=document.getElementById("slider");

current=(current+1)%photos.length;

slider.src=photos[current];

},4000);

/* Música */

function togglePlayer(){

let player=document.getElementById("playerContainer");

if(player.style.display==="none"){

player.style.display="block";

}else{

player.style.display="none";

}

}

</script>

</body>
</html>
